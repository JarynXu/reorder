name: Bug report
description: Report incorrect, unsafe, or non-idempotent reordering
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: source
    attributes:
      label: Input source
      description: Minimal Go source that reproduces the problem.
      render: go
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: reorder version
    validations:
      required: true
