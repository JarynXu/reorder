name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...

  platform:
    name: Platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: go test ./...

  quality:
    name: Format, vet, and race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  funcorder-compatibility:
    name: funcorder v0.6.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Install funcorder
        run: go install github.com/manuelarte/funcorder@v0.6.0
      - name: Build reorder
        run: go build -o "$RUNNER_TEMP/reorder" ./cmd/reorder
      - name: Rewrite fixture and verify with funcorder
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/funcorder-compat"
          mkdir -p "$fixture"
          cat > "$fixture/go.mod" <<'MOD'
          module example.com/reorder-compat

          go 1.23.0
          MOD
          cat > "$fixture/sample.go" <<'GO'
          package sample

          func private() {}

          func NewZulu() *Thing { return &Thing{} }

          func init() {}

          type Thing struct{}

          func (Thing) privateMethod() {}
          func (Thing) Zebra() {}

          func NewAlpha() *Thing { return &Thing{} }

          func (Thing) Alpha() {}

          func Public() {}
          GO

          "$RUNNER_TEMP/reorder" -write -alphabetical -function "$fixture/sample.go"
          (
            cd "$fixture"
            funcorder -alphabetical=true -function=true ./...
          )
